    <body>
        <!-- Google Tag Manager (noscript) -->
        <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-W7VK6WC7" height="0" width="0"
                style="display:none;visibility:hidden"></iframe></noscript>
        <!-- End Google Tag Manager (noscript) -->

        <!-- Theme Toggle Menu -->
        <div class="floating-menu">
            <label class="toggle-switch">
                <input type="checkbox" id="themeToggle">
                <span class="switch">
                    <span class="icon light">☀️</span>
                    <span class="icon dark">🌙</span>
                </span>
            </label>
        </div>

        <!-- Navigation Menu -->
        <div class="floating-menu" id="floatingNav">
            <a href="../../" title="Home" data-page="home">
                <i class="fas fa-home"></i>
            </a>
            <a href="../countdown-timer" title="Countdown" data-page="countdown">
                <i class="fas fa-hourglass-half"></i>
            </a>
            <a href="../clock" title="Clock" data-page="clock">
                <i class="fas fa-clock"></i>
            </a>
            <a href="../todo" title="Todo List" data-page="todo">
                <i class="fas fa-tasks"></i>
            </a>
        </div>

        <!-- Main Content -->
        <div id="countdown">
            <div class="calculator-container">
                <!-- Header -->
                <div class="calculator-header">
                    <h1><i class="fas fa-calculator"></i> Calculator</h1>
                    <p class="calculator-subtitle">Fast and accurate calculations</p>
                </div>

                <!-- Display Card -->
                <div class="display-card">
                    <!-- Display Screen -->
                    <div class="display-screen">
                        <div class="previous-operand" id="previousOperand"></div>
                        <div class="current-operand" id="currentOperand">0</div>
                    </div>

                    <!-- Copy Button -->
                    <button class="copy-btn" onclick="calculator.copyResult()" title="Copy result (Ctrl+C)">
                        <i class="fas fa-copy"></i>
                        Copy
                    </button>

                    <!-- Buttons Grid -->
                    <div class="calculator-grid">
                        <!-- Row 1 -->
                        <button class="calc-btn function-btn" onclick="calculator.clear()">
                            AC
                        </button>
                        <button class="calc-btn function-btn" onclick="calculator.delete()">
                            <i class="fas fa-backspace"></i>
                        </button>
                        <button class="calc-btn function-btn" onclick="calculator.chooseOperation('%')">
                            %
                        </button>
                        <button class="calc-btn operator-btn" onclick="calculator.chooseOperation('÷')">
                            ÷
                        </button>

                        <!-- Row 2 -->
                        <button class="calc-btn number-btn" onclick="calculator.appendNumber('7')">7</button>
                        <button class="calc-btn number-btn" onclick="calculator.appendNumber('8')">8</button>
                        <button class="calc-btn number-btn" onclick="calculator.appendNumber('9')">9</button>
                        <button class="calc-btn operator-btn" onclick="calculator.chooseOperation('×')">×</button>

                        <!-- Row 3 -->
                        <button class="calc-btn number-btn" onclick="calculator.appendNumber('4')">4</button>
                        <button class="calc-btn number-btn" onclick="calculator.appendNumber('5')">5</button>
                        <button class="calc-btn number-btn" onclick="calculator.appendNumber('6')">6</button>
                        <button class="calc-btn operator-btn" onclick="calculator.chooseOperation('-')">−</button>

                        <!-- Row 4 -->
                        <button class="calc-btn number-btn" onclick="calculator.appendNumber('1')">1</button>
                        <button class="calc-btn number-btn" onclick="calculator.appendNumber('2')">2</button>
                        <button class="calc-btn number-btn" onclick="calculator.appendNumber('3')">3</button>
                        <button class="calc-btn operator-btn" onclick="calculator.chooseOperation('+')">+</button>

                        <!-- Row 5 -->
                        <button class="calc-btn number-btn span-2" onclick="calculator.appendNumber('0')">0</button>
                        <button class="calc-btn number-btn" onclick="calculator.appendNumber('.')">.</button>
                        <button class="calc-btn equals-btn" onclick="calculator.compute()">
                            =
                        </button>
                    </div>
                </div>

                <!-- Advanced Functions -->
                <div class="advanced-section">
                    <div class="section-header">
                        <h3><i class="fas fa-star"></i> Advanced Functions</h3>
                    </div>
                    <div class="advanced-grid">
                        <button class="adv-btn" onclick="calculator.sqrt()" title="Square root (S)">
                            <i class="fas fa-square-root-alt"></i>
                            <span>√x</span>
                        </button>
                        <button class="adv-btn" onclick="calculator.square()" title="Square (Q)">
                            <i class="fas fa-superscript"></i>
                            <span>x²</span>
                        </button>
                        <button class="adv-btn" onclick="calculator.toggleSign()" title="Toggle sign">
                            <i class="fas fa-plus-minus"></i>
                            <span>±</span>
                        </button>
                        <button class="adv-btn" onclick="calculator.reciprocal()" title="Reciprocal">
                            <span>1/x</span>
                        </button>
                    </div>
                </div>

                <!-- History Section -->
                <div class="history-section" id="historySection" style="display: none;">
                    <div class="section-header">
                        <h3><i class="fas fa-history"></i> History</h3>
                        <button class="clear-history-btn" onclick="calculator.clearHistory()">
                            <i class="fas fa-trash-alt"></i>
                            Clear
                        </button>
                    </div>
                    <div class="history-list" id="historyList">
                        <!-- History items will be added here -->
                    </div>
                </div>

                <!-- Keyboard Hints -->
                <div class="keyboard-hints">
                    <div class="hint-item"><kbd>0-9</kbd> Numbers</div>
                    <div class="hint-item"><kbd>+−×÷</kbd> Operations</div>
                    <div class="hint-item"><kbd>Enter</kbd> Calculate</div>
                    <div class="hint-item"><kbd>Esc</kbd> Clear</div>
                    <div class="hint-item"><kbd>Backspace</kbd> Delete</div>
                </div>
            </div>
        </div>

        <!-- JavaScript -->
        <script src="../../index.js"></script>
        <script src="./app.js"></script>

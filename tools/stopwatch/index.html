    <body>
        <!-- Google Tag Manager (noscript) -->
        <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-W7VK6WC7" height="0" width="0"
                style="display:none;visibility:hidden"></iframe></noscript>
        <!-- End Google Tag Manager (noscript) -->

        <!-- Theme Toggle Menu -->
        <div class="floating-menu">
            <label class="toggle-switch">
                <input type="checkbox" id="themeToggle">
                <span class="switch">
                    <span class="icon light">☀️</span>
                    <span class="icon dark">🌙</span>
                </span>
            </label>
        </div>

        <!-- Navigation Menu -->
        <div class="floating-menu" id="floatingNav">
            <a href="../../" title="Home" data-page="home">
                <i class="fas fa-home"></i>
            </a>
            <a href="../countdown-timer" title="Countdown" data-page="countdown">
                <i class="fas fa-hourglass-half"></i>
            </a>
            <a href="../clock" title="Clock" data-page="clock">
                <i class="fas fa-clock"></i>
            </a>
            <a href="../todo" title="Todo List" data-page="todo">
                <i class="fas fa-tasks"></i>
            </a>
        </div>

        <!-- Main Content -->
        <div id="countdown">
            <div class="stopwatch-container">
                <!-- Header -->
                <div class="stopwatch-header">
                    <h1><i class="fas fa-stopwatch"></i> Stopwatch</h1>
                    <p class="stopwatch-subtitle">Track time with lap precision</p>
                </div>

                <!-- Display Card -->
                <div class="display-card">
                    <!-- Main Time Display -->
                    <div class="time-display" id="timeDisplay">00:00:00.00</div>

                    <!-- Control Buttons -->
                    <div class="control-buttons">
                        <button class="control-btn start-btn" id="startBtn" onclick="stopwatch.start()">
                            <i class="fas fa-play"></i>
                            <span>Start</span>
                        </button>
                        <button class="control-btn pause-btn" id="pauseBtn" onclick="stopwatch.pause()" disabled>
                            <i class="fas fa-pause"></i>
                            <span>Pause</span>
                        </button>
                        <button class="control-btn lap-btn" id="lapBtn" onclick="stopwatch.recordLap()" disabled>
                            <i class="fas fa-flag"></i>
                            <span>Lap</span>
                        </button>
                        <button class="control-btn reset-btn" id="resetBtn" onclick="stopwatch.reset()">
                            <i class="fas fa-redo"></i>
                            <span>Reset</span>
                        </button>
                    </div>
                </div>

                <!-- Laps Section -->
                <div class="laps-section" id="lapsSection" style="display: none;">
                    <div class="laps-header">
                        <h3><i class="fas fa-list-ol"></i> Lap Times</h3>
                        <button class="clear-laps-btn" onclick="stopwatch.clearLaps()">
                            <i class="fas fa-trash-alt"></i>
                            Clear All
                        </button>
                    </div>
                    <div class="laps-list" id="lapsList">
                        <!-- Laps will be added here dynamically -->
                    </div>
                </div>
            </div>
        </div>

        <!-- JavaScript -->
        <script src="../../index.js"></script>
        <script src="./app.js"></script>
    </body>

</html>
